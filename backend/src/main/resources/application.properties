spring.application.name=vetease

spring.config.import=optional:file:.env.local[.properties],optional:file:../.env.local[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

vetease.upload-dir=${VETEASE_UPLOAD_DIR:uploads/pets}
vetease.public-base-url=${VETEASE_PUBLIC_BASE_URL:http://localhost:8080}
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
vetease.mail.from=${SMTP_FROM:no-reply@vetease.local}
